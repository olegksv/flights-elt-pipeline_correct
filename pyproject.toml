[project]
name = "flights_elt_pipeline"
requires-python = ">=3.11,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.30",
    "dagster-dbt>=0.29.30",
    "dbt-postgres>=1.7.9",
    "pandas>=3.1.1",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.8",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "flights_elt_pipeline"
registry_modules = [
    "flights_elt_pipeline.components.*",
    "dagster_dbt",
]


